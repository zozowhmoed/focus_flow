  <label>API Key (${esc(ACL('اختياري', 'optional', 'optional'))})<input dir="ltr" type="password" autocomplete="off" data-in="acCfg" data-k="apiKey" value="${esc(c.apiKey)}" placeholder="sk-…"></label>
  <label>${esc(ACL('الموديل الافتراضي', 'Default model', 'Standardmodell'))}<span class="row" style="gap:6px"><select data-ch="acCfg" data-k="model" style="flex:1">${acModelOpts(c.model)}</select><button class="btn" data-act="acModels" title="${esc(ACL('تحديث القائمة', 'Refresh list', 'Liste aktualisieren'))}">🔄</button></span></label>
  <label>${esc(ACL('الحرارة', 'Temperature', 'Temperatur'))}: <b id="acTv">${c.temperature}</b><input type="range" min="0" max="2" step="0.1" data-in="acCfg" data-k="temperature" value="${c.temperature}"></label>
  <label>${esc(ACL('أقصى عدد رسائل في السياق', 'Max context messages', 'Max. Kontext-Nachrichten'))}<input type="number" min="2" max="100" data-in="acCfg" data-k="maxMsgs" value="${c.maxMsgs}"></label>
  <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-ch="acCfg" data-k="stream" ${c.stream ? 'checked' : ''}>${esc(ACL('بث الإجابة مباشرة (Streaming)', 'Stream responses', 'Antworten streamen'))}</label>
  <label class="wide">System Prompt<span class="row wrap" style="gap:6px">${AC_PRESETS.map((p, i) => `<button class="btn sm" data-act="acPreset" data-i="${i}">${p[0]} ${esc(p[1])}</button>`).join('')}</span><textarea dir="auto" data-in="acCfg" data-k="system">${esc(c.system)}</textarea></label>
  <div class="wide row wrap" style="gap:8px"><button class="btn" data-act="acExportAll">⬇ ${esc(ACL('تصدير كل المحادثات (JSON)', 'Export all chats (JSON)', 'Alle Chats exportieren'))}</button><button class="btn" data-act="acClearAll" style="color:var(--red)">🗑 ${esc(ACL('حذف كل المحادثات', 'Delete all chats', 'Alle Chats löschen'))}</button></div>
  <div class="wide muted" style="font-size:12px">🔒 ${esc(ACL('وضع المستخدم الواحد: لا تسجيل دخول. المحادثات والمفتاح محفوظان في متصفحك فقط (localStorage) ويُرسل المحتوى إلى عنوان API أعلاه.', 'Single-user mode: no login. Chats and key live only in this browser (localStorage); message content is sent to the API URL above.', 'Einzelnutzer-Modus: Daten nur lokal; Nachrichten gehen an die API-URL.'))}</div>`;
}
function acRenderAll(el) {
  el = el || $('#page-aichat'); if (!el) return; const c = acConv(), busy = !!AC.busyId;
  setHTML(el, `${pageHead(t('p_aichat'), ACL('مساعد ذكي بمحادثات محفوظة، موديلات متعددة وتصدير', 'Smart assistant with saved chats, models and export', 'KI-Assistent mit gespeicherten Chats'))}
  <div class="ac ${AC.sb ? 'sb' : ''}" id="acRoot">
   <aside class="ac-side"><div class="row" style="gap:6px"><button class="btn primary grow" data-act="acNewChat">＋ ${esc(ACL('محادثة جديدة', 'New chat', 'Neuer Chat'))}</button><button class="btn ghost ac-menu" data-act="acSb">✕</button></div><div class="ac-list" id="acList"></div></aside>
   <section class="ac-main">
    <div class="ac-head"><button class="btn ghost ico ac-menu" data-act="acSb">☰</button><div class="ac-t" id="acTitle">${esc(c ? c.title : t('p_aichat'))}</div>
     <select id="acModelSel" data-ch="acModelSel" title="${esc(ACL('الموديل', 'Model', 'Modell'))}">${acModelOpts(c && c.model || AC.cfg.model)}</select>
     <button class="btn ghost ico" data-act="acExportMd" title="Markdown">⬇</button><button class="btn ghost ico" data-act="acExportJson" title="JSON">{}</button><button class="btn ghost ico" data-act="acCfgToggle" title="${esc(t('settings') === 'settings' ? 'Settings' : t('settings'))}">⚙️</button></div>
    <div class="ac-cfg" id="acCfg" hidden></div>
    <div class="ac-msgs" id="acMsgs" aria-live="polite"></div>
    <div class="ac-in"><textarea id="acIn" rows="1" dir="auto" data-in="acGrow" data-enter="acSend" placeholder="${esc(ACL('اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)', 'Message… (Enter to send, Shift+Enter for newline)', 'Nachricht… (Enter senden)'))}"></textarea>
     <button class="btn primary" id="acSendBtn" data-act="${busy ? 'acStop' : 'acSend'}">${busy ? '⏹ ' + esc(ACL('إيقاف', 'Stop', 'Stopp')) : '➤ ' + esc(ACL('إرسال', 'Send', 'Senden'))}</button></div>
   </section></div>`);
  acRenderList(); acRenderMsgs(); acRenderCfg();
}
function acSyncBusy() {
  const b = $('#acSendBtn'); if (!b) return; const busy = !!AC.busyId;
  b.dataset.act = busy ? 'acStop' : 'acSend'; b.textContent = busy ? '⏹ ' + ACL('إيقاف', 'Stop', 'Stopp') : '➤ ' + ACL('إرسال', 'Send', 'Senden');
}
function acPaint(m) {
  if (AC.raf) return; AC.raf = requestAnimationFrame(() => {
    AC.raf = 0; const box = $('#acMsgs'), el = box && box.querySelector(`[data-id="${m.id}"] .ac-c`); if (!el) return;
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    el.innerHTML = m.content ? acMd(m.content) : '<span class="ac-dots"><i></i><i></i><i></i></span>'; if (near) box.scrollTop = box.scrollHeight;
  });
}

/* ── API ── */
function acBuildContext(c, upto) {
  const sys = (AC.cfg.system || '').trim(), msgs = c.msgs.slice(0, upto).filter(m => m.content && !m.pending), out = []; let chars = 0;
  for (let i = msgs.length - 1; i >= 0 && out.length < AC.cfg.maxMsgs; i--) { chars += msgs[i].content.length; if (out.length && chars > AC.cfg.maxChars) break; out.unshift({ role: msgs[i].role, content: msgs[i].content }); }
  while (out.length > 1 && out[0].role !== 'user') out.shift();
  return sys ? [{ role: 'system', content: sys }, ...out] : out;
}
function acErrText(status, body) {
  let d = ''; try { const j = JSON.parse(body); d = (j.error && (j.error.message || j.error)) || j.message || j.detail || ''; } catch { d = (body || '').slice(0, 200); }
  d = typeof d === 'string' ? d : JSON.stringify(d);
  const map = { 401: ACL('المفتاح غير صالح أو مفقود', 'Invalid or missing API key', 'API-Key ungültig'), 403: ACL('الوصول مرفوض', 'Access denied', 'Zugriff verweigert'), 404: ACL('الموديل أو المسار غير متاح — جرّب auto', 'Model or endpoint not found — try “auto”', 'Modell nicht gefunden — „auto“ versuchen'), 429: ACL('تجاوز حد الطلبات، حاول بعد قليل', 'Rate limited, retry shortly', 'Rate-Limit, später erneut'), 503: ACL('الموديل غير متاح حاليًا — جرّب موديلًا آخر أو auto', 'Model unavailable — try another or “auto”', 'Modell nicht verfügbar') };
  return `${map[status] || ACL('خطأ من الخادم', 'Server error', 'Serverfehler')} (HTTP ${status})${d ? ' — ' + d.slice(0, 160) : ''}`;
}
async function acRun(c, m) {
  const idx = c.msgs.indexOf(m), cfg = AC.cfg, model = c.model || cfg.model || 'auto';
  const ctl = AC.ctl = new AbortController(); let timedOut = false; const to = setTimeout(() => { timedOut = true; ctl.abort(); }, 60000);
  AC.busyId = c.id; m.pending = true; m.error = ''; m.stopped = false; m.model = model; acSyncBusy();
  try {
    const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
    const res = await fetch(url, { method: 'POST', signal: ctl.signal, headers: Object.assign({ 'Content-Type': 'application/json' }, cfg.apiKey ? { Authorization: 'Bearer ' + cfg.apiKey } : {}), body: JSON.stringify({ model, messages: acBuildContext(c, idx), stream: !!cfg.stream, temperature: +cfg.temperature }) });
    clearTimeout(to);
    if (!res.ok) throw new Error(acErrText(res.status, await res.text().catch(() => '')));
    const ct = res.headers.get('content-type') || '';
    if (cfg.stream && res.body && /event-stream|ndjson|text\/plain/.test(ct)) {
      const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
        let nl; while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1); if (!line.startsWith('data:')) continue;
          const d = line.slice(5).trim(); if (d === '[DONE]') continue;
          try { const j = JSON.parse(d), ch = j.choices && j.choices[0]; if (j.model) m.model = j.model; const tx = ch && ((ch.delta && ch.delta.content) ?? (ch.message && ch.message.content)); if (tx) { m.content += tx; acPaint(m); } if (j.error) throw new Error(j.error.message || 'stream error'); } catch (x) { if (x.message && !(x instanceof SyntaxError)) throw x; }
        }
      }
    } else {
      const j = await res.json(), ch = j.choices && j.choices[0]; if (j.model) m.model = j.model;
      m.content = (ch && ((ch.message && ch.message.content) || ch.text)) || ''; acPaint(m);
    }
    if (!m.content.trim()) throw new Error(ACL('رد فارغ من الموديل', 'Empty response from model', 'Leere Antwort'));
  } catch (e) {
    clearTimeout(to);
    if (e.name === 'AbortError') { if (timedOut) m.error = ACL('انتهت مهلة الاتصال (60 ثانية)', 'Request timed out (60s)', 'Zeitüberschreitung'); else m.stopped = true; }
    else m.error = (e instanceof TypeError) ? ACL('تعذر الاتصال بالخادم. تحقق من الإنترنت أو عنوان API (قد يكون CORS).', 'Cannot reach the server. Check connection or API URL (maybe CORS).', 'Server nicht erreichbar.') : e.message;
  } finally {
    m.pending = false; AC.busyId = null; AC.ctl = null; c.updated = Date.now(); acSaveConvs();
    if (AC.active === c.id) { acRenderMsgs(); } acRenderList(); acSyncBusy();
  }
}

/* ── actions ── */
ACT.acSend = async () => {
  if (AC.busyId) return; const inp = $('#acIn'); const text = inp ? inp.value.trim() : ''; if (!text) return;
  let c = acConv() || acNew(); inp.value = ''; inp.style.height = '';
  c.msgs.push({ id: uid(), role: 'user', content: text, ts: Date.now() });
  if (c.msgs.length === 1) c.title = text.replace(/\s+/g, ' ').slice(0, 40);
  const m = { id: uid(), role: 'assistant', content: '', ts: Date.now(), pending: true }; c.msgs.push(m);
  acRenderList(); acRenderMsgs(); const tt = $('#acTitle'); if (tt) tt.textContent = c.title; await acRun(c, m);
};
ACT.acStop = () => { if (AC.ctl) AC.ctl.abort(); };
ACT.acRegen = async () => {
  const c = acConv(); if (!c || AC.busyId) return; const last = c.msgs[c.msgs.length - 1]; if (!last || last.role !== 'assistant') return;
  last.content = ''; last.error = ''; last.ts = Date.now(); acRenderMsgs(); await acRun(c, last);
};
ACT.acNewChat = () => { if (AC.busyId) return toast(ACL('انتظر انتهاء التوليد أو أوقفه', 'Wait or stop the current reply', 'Erst stoppen'), 'info'); acNew(); AC.sb = false; acRenderAll(); setTimeout(() => $('#acIn') && $('#acIn').focus(), 50); };
ACT.acOpen = el => { if (AC.busyId) return; AC.active = el.dataset.id; AC.sb = false; lsSet('aichat.active', AC.active); acRenderAll(); };
ACT.acSb = () => { AC.sb = !AC.sb; $('#acRoot') && $('#acRoot').classList.toggle('sb', AC.sb); };
ACT.acRename = async el => {
  const c = AC.convs.find(x => x.id === el.dataset.id); if (!c) return;
  const v = await promptBox({ title: t('edit'), label: ACL('اسم المحادثة', 'Chat name', 'Chat-Name'), value: c.title }); if (v && v.trim()) { c.title = v.trim().slice(0, 80); acSaveConvs(); acRenderList(); if (c.id === AC.active && $('#acTitle')) $('#acTitle').textContent = c.title; }
};
ACT.acDel = async el => {
  const c = AC.convs.find(x => x.id === el.dataset.id); if (!c || AC.busyId === c.id) return;
  if (!await confirmBox(ACL('حذف هذه المحادثة؟', 'Delete this chat?', 'Chat löschen?'), { danger: true, ok: t('delete') })) return;
  AC.convs = AC.convs.filter(x => x !== c); if (AC.active === c.id) AC.active = AC.convs[0] ? AC.convs[0].id : null; acSaveConvs(); acRenderAll();
};
ACT.acClearAll = async () => { if (AC.busyId || !await confirmBox(ACL('حذف كل المحادثات نهائيًا؟', 'Delete ALL chats permanently?', 'ALLE Chats löschen?'), { danger: true, ok: t('delete') })) return; AC.convs = []; AC.active = null; acSaveConvs(); acRenderAll(); };
ACT.acCopyMsg = el => { const c = acConv(), m = c && c.msgs.find(x => x.id === el.dataset.id); if (m) copyText(m.content); };
ACT.acCopyCode = el => { const cd = el.closest('.ac-code'); if (cd) copyText(cd.querySelector('code').textContent); };
ACT.acCfgToggle = () => { AC.showCfg = !AC.showCfg; acRenderCfg(); };
ACT.acPreset = el => { AC.cfg.system = AC_PRESETS[+el.dataset.i][2]; acSaveCfg(); acRenderCfg(); };
ACT.acModels = async () => {
  try {
    const r = await fetch(AC.cfg.base.replace(/\/+$/, '') + '/models', { headers: AC.cfg.apiKey ? { Authorization: 'Bearer ' + AC.cfg.apiKey } : {} });
    if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json();
    AC.cfg.models = (j.data || j.models || []).map(x => typeof x === 'string' ? x : x.id).filter(Boolean).slice(0, 200); acSaveCfg();
    toast(ACL(`تم تحميل ${AC.cfg.models.length} موديل`, `Loaded ${AC.cfg.models.length} models`, `${AC.cfg.models.length} Modelle`), 'success'); acRenderCfg(); const s = $('#acModelSel'); if (s) s.innerHTML = acModelOpts((acConv() || {}).model || AC.cfg.model);
  } catch (e) { toast(ACL('تعذر جلب الموديلات: ', 'Could not load models: ', 'Modelle nicht ladbar: ') + e.message, 'error'); }
};
const acFile = s => (s || 'chat').replace(/[^\w\u0600-\u06FF-]+/g, '_').slice(0, 40);
const acToMd = c => `# ${c.title}\n\n_${new Date(c.created).toLocaleString()} · ${c.model || ''}_\n\n` + c.msgs.filter(m => m.content).map(m => `## ${m.role === 'user' ? '👤 User' : '🤖 Assistant' + (m.model ? ' (' + m.model + ')' : '')}\n\n${m.content}\n`).join('\n');
ACT.acExportMd = () => { const c = acConv(); if (!c || !c.msgs.length) return toast(ACL('لا توجد رسائل للتصدير', 'Nothing to export', 'Nichts zu exportieren'), 'info'); download(acFile(c.title) + '.md', acToMd(c), 'text/markdown'); };
ACT.acExportJson = () => { const c = acConv(); if (!c || !c.msgs.length) return toast(ACL('لا توجد رسائل للتصدير', 'Nothing to export', 'Nichts zu exportieren'), 'info'); download(acFile(c.title) + '.json', JSON.stringify(c, null, 2)); };
ACT.acExportAll = () => download('focusflow-ai-chats.json', JSON.stringify({ exported: new Date().toISOString(), conversations: AC.convs }, null, 2));
INP.acGrow = el => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; };
CHG.acModelSel = el => { const c = acConv(); AC.cfg.model = el.value; if (c) { c.model = el.value; acSaveConvs(); } acSaveCfg(); };
const acCfgSet = el => {
  const k = el.dataset.k; let v = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'temperature') { v = clamp(+v, 0, 2); const b = $('#acTv'); if (b) b.textContent = v; }
  if (k === 'maxMsgs') v = clamp(Math.round(+v) || 20, 2, 100);
  if (k === 'base') v = String(v).trim(); AC.cfg[k] = v; acSaveCfg();
  if (k === 'model') { const s = $('#acModelSel'); if (s) s.value = v; }
};
INP.acCfg = acCfgSet; CHG.acCfg = acCfgSet;

registerPage({
  id: 'aichat', title: 'p_aichat', deps: [],
  mount(el) { acLoad(); acRenderAll(el); },
  update(el) { acLoad(); acRenderAll(el); },
  show() { setTimeout(() => { const b = $('#acMsgs'); if (b) b.scrollTop = b.scrollHeight; }, 30); }
});

/* ═══ BOOT ═══ */
document.body.insertAdjacentHTML('beforeend','');
bootApp().catch(e => { console.error(e); renderAuth(); const b = document.getElementById('boot'); b && b.classList.add('done'); });
</script>
</body>
