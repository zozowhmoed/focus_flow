<!DOCTYPE html>
<html lang="ar" dir="rtl" data-eff="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="FocusFlow Pro — Pomodoro, flashcards, notes, PDFs, ambient sound and study groups.">
<title>FocusFlow Pro — Flashcards Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c6cff'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══ FocusFlow Pro — integrated timer-switch protection ═══ */
:root{
  --bg:#080a12;--bg2:#0d1019;--bg3:#131726;--bg4:#1a1f33;
  --surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.07);--surface3:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);--border3:rgba(255,255,255,.24);
  --text:#eef0f8;--text2:#9aa1b9;--text3:#646c85;
  --accent:#7c6cff;--accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);--accent-line:color-mix(in srgb,var(--accent) 45%,transparent);
  --accent-text:color-mix(in srgb,var(--accent) 55%,#fff);
  --green:#34d399;--orange:#fb923c;--red:#f87171;--pink:#f472b6;--cyan:#22d3ee;--yellow:#fbbf24;
  --green-soft:rgba(52,211,153,.14);--red-soft:rgba(248,113,113,.14);--orange-soft:rgba(251,146,60,.14);--yellow-soft:rgba(251,191,36,.14);
  --f-display:'Instrument Serif','IBM Plex Sans Arabic',Georgia,serif;
  --f-body:'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:10px;--r2:14px;--r3:20px;--r4:28px;
  --sh:0 4px 18px rgba(0,0,0,.35);--sh2:0 14px 50px rgba(0,0,0,.55);
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sb-w:264px;--sb-w-mini:72px;--top-h:64px;--pad:clamp(14px,2.4vw,28px);
  --fs:14px;color-scheme:dark;
}
:root[data-eff="light"]{
  --bg:#f4f1ea;--bg2:#ece8de;--bg3:#e4dfd3;--bg4:#d9d3c5;
  --surface:rgba(255,255,255,.7);--surface2:rgba(0,0,0,.045);--surface3:rgba(0,0,0,.08);
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.15);--border3:rgba(0,0,0,.26);
  --text:#1a1c2b;--text2:#51597a;--text3:#8a91ab;
  --accent-text:color-mix(in srgb,var(--accent) 80%,#000);
  --sh:0 4px 18px rgba(30,30,60,.08);--sh2:0 14px 50px rgba(30,30,60,.14);color-scheme:light;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-line)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text2)}.dim{color:var(--text3)}.sm{font-size:.86rem}.xs{font-size:.75rem}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}.between{justify-content:space-between}.center{justify-content:center;text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* boot + auth */
#boot{position:fixed;inset:0;z-index:900;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
#boot.done{opacity:0;pointer-events:none}
.boot-box{text-align:center}.boot-logo{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 10px 40px var(--accent-line);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#auth{position:fixed;inset:0;z-index:500;overflow:auto;background:var(--bg);display:none}
#auth.show{display:block}
.auth-wrap{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-hero{position:relative;padding:clamp(28px,6vw,72px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:radial-gradient(900px 500px at 20% 10%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 60%),radial-gradient(700px 500px at 90% 90%,rgba(244,114,182,.22),transparent 60%),var(--bg2)}
.auth-hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.05;margin:18px 0 14px}
.auth-hero h1 em{color:var(--accent-text)}
.auth-hero p{color:var(--text2);max-width:520px;font-size:1.07rem}
.auth-feats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px;max-width:560px}
.auth-feat{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r2);font-size:.9rem}
.auth-side{display:grid;place-items:center;padding:24px}
.auth-card{width:min(430px,100%);background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r4);padding:30px;box-shadow:var(--sh2)}
.auth-card h2{font-size:1.5rem;margin-bottom:4px}
@media(max-width:860px){.auth-wrap{grid-template-columns:1fr}.auth-hero{padding:28px 20px}.auth-feats{display:none}}

/* brand */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.brand-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--pink));box-shadow:0 4px 16px var(--accent-line)}
.pro{font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--accent-line)}

/* shell */
#app{display:none;min-height:100vh;min-height:100dvh}
#app.show{display:block}
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sb-w);background:var(--bg2);border-inline-end:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:transform .3s var(--ease),width .25s var(--ease)}
.sb-top{padding:18px 18px 10px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 12px}
.nav-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:start;padding:9px 11px;border-radius:var(--r);color:var(--text2);font-weight:500;transition:background .15s,color .15s;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-line)}
.nav-ico{font-size:1.1rem;width:24px;text-align:center;flex:none}
.nav-badge{margin-inline-start:auto;font-size:.68rem;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:#fff}
.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.mini-today{padding:12px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--border)}
.sync{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.sync.syncing i{background:var(--yellow);animation:pulse 1s infinite}.sync.offline i{background:var(--text3)}.sync.error i{background:var(--red)}
.main{margin-inline-start:var(--sb-w);min-height:100vh;min-height:100dvh;transition:margin .25s var(--ease)}
body.mini .sidebar{width:var(--sb-w-mini)}body.mini .main{margin-inline-start:var(--sb-w-mini)}
body.mini .nav-txt,body.mini .nav-label,body.mini .brand-txt,body.mini .mini-today,body.mini .sync span,body.mini .nav-badge{display:none}
body.mini .nav-item{justify-content:center}
.topbar{position:sticky;top:0;z-index:80;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 var(--pad);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top-title{font-weight:700;font-size:1.08rem}
.top-right{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.page{display:none;padding:var(--pad);max-width:1280px;margin:0 auto;animation:fadeUp .35s var(--ease)}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.5rem);line-height:1.1}
.ph p{color:var(--text2);margin-top:4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:95;display:none}.scrim.show{display:block}
.bottom-nav{display:none}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);width:min(300px,86vw)}
  [dir=rtl] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none!important}
  .main,body.mini .main{margin-inline-start:0}
  body.mini .nav-txt,body.mini .nav-label,body.mini .brand-txt,body.mini .mini-today,body.mini .sync span,body.mini .nav-badge{display:revert}
  body.mini .sidebar{width:min(300px,86vw)}
  .page{padding-bottom:92px}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:85;background:var(--bg2);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:var(--r);font-size:.68rem;color:var(--text3)}
  .bn span:first-child{font-size:1.25rem}.bn.active{color:var(--accent-text);background:var(--accent-soft)}
}
@media(min-width:901px){.only-mobile{display:none!important}}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:18px;position:relative}
.card.flat{background:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-t{font-weight:650;font-size:1rem;display:flex;align-items:center;gap:8px}
.card-s{font-size:.8rem;color:var(--text3);margin-top:2px}
.stat{padding:16px;border-radius:var(--r3);background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:.78rem;color:var(--text3);font-weight:600;letter-spacing:.03em}
.stat .v{font-family:var(--f-mono);font-size:1.7rem;font-weight:500;line-height:1.2}
.stat .d{font-size:.78rem;color:var(--text2)}
.hero-card{background:radial-gradient(600px 240px at 10% 0,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%),var(--surface);overflow:hidden}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);font-weight:600;background:var(--surface2);border:1px solid var(--border2);transition:transform .12s,background .15s,border-color .15s;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--surface3);border-color:var(--border3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 18px var(--accent-line)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--red);background:var(--red-soft);border-color:transparent}.btn.danger:hover{background:var(--red);color:#fff}
.btn.sm{padding:6px 12px;font-size:.86rem}.btn.lg{padding:13px 24px;font-size:1.05rem;border-radius:var(--r2)}.btn.ico{padding:8px;width:38px;height:38px;border-radius:var(--r)}.btn.block{width:100%}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
[dir=rtl] .select{background-position:18px 50%,13px 50%}
.select option{background:var(--bg2);color:var(--text)}
.textarea{resize:vertical;min-height:90px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field>label{font-size:.82rem;font-weight:600;color:var(--text2)}
.err{color:var(--red);font-size:.86rem;background:var(--red-soft);padding:9px 12px;border-radius:var(--r);margin-bottom:12px}
.ok{color:var(--green);font-size:.86rem;background:var(--green-soft);padding:9px 12px;border-radius:var(--r);margin-bottom:12px}
.divider{display:flex;align-items:center;gap:12px;color:var(--text3);font-size:.8rem;margin:16px 0}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--surface3);border:1px solid var(--border2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--spring);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle.on{background:var(--accent);border-color:var(--accent)}.toggle.on::after{transform:translateX(18px)}[dir=rtl] .toggle.on::after{transform:translateX(-18px)}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--surface3);width:100%;outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg2);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:calc(var(--r2) - 3px);font-weight:600;font-size:.88rem;color:var(--text2)}
.seg button.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 16px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--text2)}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}.badge.green{background:var(--green-soft);color:var(--green)}.badge.red{background:var(--red-soft);color:var(--red)}.badge.orange{background:var(--orange-soft);color:var(--orange)}.badge.yellow{background:var(--yellow-soft);color:var(--yellow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--text2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .6s var(--ease)}
.empty{text-align:center;padding:28px 14px;color:var(--text3)}.empty .e-i{font-size:2.2rem;margin-bottom:8px;opacity:.85}.empty b{display:block;color:var(--text2);margin-bottom:4px}
.skeleton{background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r)}@keyframes sk{to{background-position:-200% 0}}
kbd{font-family:var(--f-mono);font-size:.74rem;padding:2px 7px;border-radius:6px;background:var(--surface3);border:1px solid var(--border2);border-bottom-width:2px}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);transition:border-color .15s,background .15s}
.li+.li{margin-top:8px}.li:hover{border-color:var(--border2)}
.li.link{cursor:pointer}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border3);display:grid;place-items:center;flex:none;font-size:.8rem;color:#fff;transition:all .15s}
.check.on{background:var(--green);border-color:var(--green)}
.li.done .li-t{text-decoration:line-through;color:var(--text3)}
.pri{width:4px;align-self:stretch;border-radius:4px;flex:none}.pri.p1{background:var(--red)}.pri.p2{background:var(--orange)}.pri.p3{background:var(--cyan)}.pri.p0{background:var(--border2)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:46px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent));min-height:3px;transition:height .6s var(--ease)}
.bars .b.today i{background:linear-gradient(180deg,var(--pink),var(--accent))}
.bars .b span{font-size:.72rem;color:var(--text3)}.bars .b em{font-style:normal;font-size:.68rem;color:var(--text2);font-family:var(--f-mono)}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .c{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:.72rem;color:var(--text3);position:relative}
.cal .c.l1{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text2)}.cal .c.l2{background:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--text)}.cal .c.l3{background:color-mix(in srgb,var(--accent) 70%,transparent);color:#fff}.cal .c.l4{background:var(--accent);color:#fff}

.ambient-list-row{min-width:0;flex-wrap:wrap}.ambient-list-row .grow{flex:1 1 90px}.ambient-level input:disabled{opacity:.3;cursor:not-allowed}.ambient-level b{font-size:.72rem;color:var(--text3)}

@media(max-width:760px){.global-due-notice{padding:7px 10px}.global-due-inner{align-items:flex-start;padding:9px 10px}.global-due-copy{display:block}.global-due-copy span{display:block;margin-top:2px}.global-due-inner .btn{padding:7px 10px;font-size:.78rem}.review-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.review-word{grid-template-columns:minmax(0,1fr) auto}.review-word-progress{grid-column:1/-1}.mastery-group .review-word{grid-template-columns:minmax(0,1fr) auto}.mcq-options{grid-template-columns:1fr}.write-config{grid-template-columns:1fr}.write-row{grid-template-columns:1fr}}

.room{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);cursor:pointer;width:100%;text-align:start}.room:hover{background:var(--surface2)}.room.on{background:var(--accent-soft)}

/* ── safe HTML templating: every interpolation is escaped unless wrapped in raw() ── */
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(String(s ?? ''));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const one = v => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(one).join('') : (v === false || v == null) ? '' : esc(v);
const html = (strs, ...vals) => { let o = ''; strs.forEach((s, i) => { o += s; if (i < vals.length) o += one(vals[i]); }); return new Raw(o); };
const setHTML = (el, r) => { el.innerHTML = r instanceof Raw ? r.s : String(r); };

/* sanitize rich-text coming from notes (own data, but also imports) */
const SAFE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'H1', 'H2', 'H3', 'P', 'BR', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'CODE', 'PRE', 'MARK', 'HR', 'DIV', 'SPAN', 'A', 'IMG']);
function sanitizeHTML(dirty) {
  const doc = new DOMParser().parseFromString('<body>' + (dirty || '') + '</body>', 'text/html');
  const walk = n => {
    [...n.children].forEach(c => {
      if (!SAFE_TAGS.has(c.tagName)) {
        // drop dangerous containers entirely; for other unknown tags sanitize the children BEFORE unwrapping them
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE|SVG|MATH|FRAME|FRAMESET|LINK|META|BASE|FORM)$/.test(c.tagName)) { c.remove(); return; }
        walk(c); c.replaceWith(...c.childNodes); return;
      }
      [...c.attributes].forEach(a => {
        const ok = (c.tagName === 'A' && a.name === 'href' && /^(https?:|mailto:)/i.test(a.value)) || (c.tagName === 'IMG' && a.name === 'src' && /^(https?:|data:image\/)/i.test(a.value)) || (a.name === 'dir');
        if (!ok) c.removeAttribute(a.name);
      });
      if (c.tagName === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener noreferrer'); }
      walk(c);
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
const htmlToText = h => { const d = document.createElement('div'); d.innerHTML = sanitizeHTML(h); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

/* ── tiny event bus ── */
const bus = { h: {}, on(e, f) { (this.h[e] ||= []).push(f); }, emit(e, d) { (this.h[e] || []).forEach(f => { try { f(d); } catch (x) { reportError(x); } }); } };
let _lastErrToast = 0;
function reportError(err) {
  console.error('[FocusFlow]', err);
  if (Date.now() - _lastErrToast > 6000) { _lastErrToast = Date.now(); toast(t('err_generic'), 'error'); }
}
window.addEventListener('error', e => { if (e.message && !/ResizeObserver|Script error/i.test(e.message)) reportError(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { console.error('[FocusFlow] promise', e.reason); });

/* ── i18n ── */
let LANG = 'ar';
const LOCALES = { ar: 'ar-EG-u-nu-latn', en: 'en-GB', de: 'de-DE' };
const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]);
  if (s === undefined) s = I18N.en[k];
  if (s === undefined) return k;
  return v ? s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? '') : s;
};
const fmtDate = (ms, o = { day: 'numeric', month: 'short' }) => new Intl.DateTimeFormat(LOCALES[LANG], o).format(new Date(ms));
const fmtDayLong = ms => fmtDate(ms, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = ms => new Intl.DateTimeFormat(LOCALES[LANG], { hour: '2-digit', minute: '2-digit', hour12: S.prefs.timeFmt === '12' }).format(new Date(ms));
const fmtNum = n => new Intl.NumberFormat(LOCALES[LANG]).format(n);
function fmtDur(sec, short) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h && m) return `${h}${t('u_h')} ${m}${t('u_m')}`;
  if (h) return `${h}${t('u_h')}`;
  if (!short && sec < 60 && sec > 0) return `${sec}${t('u_s')}`;
  return `${m}${t('u_m')}`;
}
const fmtClock = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
/* v44: display remaining time in whole minutes when enabled */
function fmtTimerDisplay(sec) {
  if (S.prefs.timerMinutesOnly) {
    const m = Math.ceil(Math.max(0, Number(sec) || 0) / 60);
    return `${m}${t('u_m')}`;
  }
  return fmtClock(sec);
}
function relTime(ms) {
  if (!ms) return '—';
  const d = ms - Date.now(), a = Math.abs(d);
  const rtf = new Intl.RelativeTimeFormat(LOCALES[LANG], { numeric: 'auto' });
  if (a < 60e3) return rtf.format(0, 'second');
  if (a < 3600e3) return rtf.format(Math.round(d / 60e3), 'minute');
  if (a < 86400e3) return rtf.format(Math.round(d / 3600e3), 'hour');
  if (a < 30 * 86400e3) return rtf.format(Math.round(d / 86400e3), 'day');
  return fmtDate(ms, { day: 'numeric', month: 'short', year: 'numeric' });
}

const mqDark = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function effTheme() { const th = S.prefs.theme; return th === 'auto' ? (mqDark && mqDark.matches ? 'dark' : 'light') : th; }
function applyPrefs() {
  const p = S.prefs, r = document.documentElement;
  if (!p.lang) p.lang = detectLang();
  LANG = I18N[p.lang] ? p.lang : 'en';
  r.lang = LANG; r.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  r.dataset.eff = effTheme();
  r.style.setProperty('--accent', p.accent);
  if (p.hitColor) r.style.setProperty('--hit', p.hitColor); else r.style.removeProperty('--hit');
  r.style.setProperty('--fs', (14 * p.fontScale / 100) + 'px');
  r.style.setProperty('--ringw', p.ringWidth);
  document.body.classList.toggle('no-anim', !p.anim);
  document.body.classList.toggle('compact', !!p.compact);
  document.body.classList.toggle('mini', !!p.mini);
  const mt = $('meta[name=theme-color]'); if (mt) mt.content = effTheme() === 'dark' ? '#080a12' : '#f4f1ea';
  if (p.firstDay == null) p.firstDay = LANG === 'ar' ? 6 : LANG === 'de' ? 1 : 0;

  },

/* ── stats engine ── */
const STATS = { byDay: {}, byHour: new Array(24).fill(0), bySubject: {}, totalSec: 0, sessionCount: 0, todaySec: 0, week: [], streak: 0, best: 0, activeDays: 0, weekSec: 0, monthSec: 0, avgSession: 0 };
function recomputeStats() {
  const byDay = {}, byHour = new Array(24).fill(0), bySubject = {};
  let total = 0, count = 0, countedSec = 0;
  for (const s of S.sessions) {
    if (s.mode !== 'focus') continue;
    const sec = s.seconds || 0; total += sec;
    if (!s.partial) { count++; countedSec += sec; }
    byDay[s.day] = (byDay[s.day] || 0) + sec;
    byHour[s.hour ?? new Date(s.start).getHours()] += sec;
    const sid = s.subjectId || 's_gen'; bySubject[sid] = (bySubject[sid] || 0) + sec;
  }
  const minSec = (S.prefs.streakMin || 5) * 60;
  const today = startOfDay();
  const isActive = k => (byDay[k] || 0) >= minSec;
  let streak = 0, d = new Date(today);
  if (!isActive(dayKey(d))) d = addDays(d, -1);
  while (isActive(dayKey(d))) { streak++; d = addDays(d, -1); }
  const keys = Object.keys(byDay).filter(isActive).sort();
  let best = 0, run = 0, prev = null;
  keys.forEach(k => { const dt = parseDay(k); if (prev && Math.round((dt - prev) / 864e5) === 1) run++; else run = 1; best = Math.max(best, run); prev = dt; });
  const fd = S.prefs.firstDay ?? 0;
  const dow = (today.getDay() - fd + 7) % 7;
  const weekStart = addDays(today, -dow);
  const week = Array.from({ length: 7 }, (_, i) => { const dd = addDays(weekStart, i); return { key: dayKey(dd), date: dd, sec: byDay[dayKey(dd)] || 0, today: dayKey(dd) === dayKey(today) }; });
  const monthKey = dayKey(today).slice(0, 7);
  const monthSec = Object.keys(byDay).filter(k => k.startsWith(monthKey)).reduce((a, k) => a + byDay[k], 0);
  Object.assign(STATS, { byDay, byHour, bySubject, totalSec: total, sessionCount: count, todaySec: byDay[dayKey(today)] || 0, week, weekSec: week.reduce((a, w) => a + w.sec, 0), monthSec, streak, best: Math.max(best, streak), activeDays: keys.length, avgSession: count ? countedSec / count : 0 });
  pushProfile();
}
bus.on('pref', k => { if (['firstDay', 'streakMin'].includes(k) || k === '*') { recomputeStats(); touch('stats'); } });

/* ── legacy (v10–v13) migration: arrays inside user doc → sub-collections ── */
async function migrateLegacy(d) {
  if (!d || d.schema >= 2) return false;
  const ops = [];
  (d.notes || []).forEach(n => {
    if (!n || !n.id) return;
    ops.push({ kind: 'notes', id: n.id, data: { id: n.id, title: n.title || '', html: sanitizeHTML(n.content || ''), text: htmlToText(n.content || ''), tags: n.tag ? [String(n.tag).replace(/^#/, '')] : [], pinned: false, createdAt: n.created || Date.now(), updatedAt: n.updated || Date.now() } });
  });
  (d.tasks || []).forEach(x => { if (x && x.id) ops.push({ kind: 'tasks', id: x.id, data: { id: x.id, title: x.text || '', done: !!x.done, priority: 0, due: null, subjectId: 's_gen', createdAt: x.created || Date.now(), doneAt: x.done ? Date.now() : null } }); });
  const hist = (d.stats && d.stats.sessionHistory) || [];
  hist.forEach(h => {
    if (!h || !h.timestamp) return;
    const dur = (h.duration || 25) * 60, id = 'm' + h.timestamp, dt = new Date(h.timestamp);
    ops.push({ kind: 'sessions', id, data: { id, start: h.timestamp - dur * 1000, end: h.timestamp, seconds: dur, mode: 'focus', subjectId: 's_gen', day: dayKey(dt), hour: dt.getHours(), partial: false, migrated: true } });
  });
  // legacy totals beyond the 100 kept history rows
  const histSec = hist.reduce((a, h) => a + (h.duration || 25) * 60, 0);
  const extra = ((d.stats && d.stats.totalFocusSeconds) || 0) - histSec;
  if (extra > 600) { const ts = Date.now() - 200 * 864e5; ops.push({ kind: 'sessions', id: 'm_legacy_total', data: { id: 'm_legacy_total', start: ts, end: ts + extra * 1000, seconds: extra, mode: 'focus', subjectId: 's_gen', day: dayKey(ts), hour: 12, partial: true, migrated: true } }); }
  const part = { schema: 2, migratedAt: Date.now() };
  const old = d.settings || {};
  if (old.durations) part.prefs = { ...(d.prefs || {}), durFocus: old.durations.focus || 25, durShort: old.durations.short || 5, durLong: old.durations.long || 15, longEvery: old.longBreakEvery || 4, autoBreak: !!old.autoBreak, autoFocus: !!old.autoPomodoro, soundAlerts: old.soundAlerts !== false, tabTitle: old.tabTitle !== false };
  if (d.stats && d.stats.achievements && !d.achievements) part.achievements = d.stats.achievements;
  if (ops.length) { try { await DB.batch(ops); } catch (e) { console.error('migration failed', e); return false; } }
  await DB.mergeUser(part);
  if (ops.length) toast(t('migrated', { n: ops.length }), 'success', 5000);
  return true;
}

  if (previousUid && previousUid !== u.uid) {
    S.commandHistory = []; S.timerState = null; S.mindmaps = [];

    AI.msgs = []; AI.historyLoaded = false; AI.commandsOpen = false; AI.commandQuery = '';
  }
  S.user = u; S.ready = false;
  try {
    await DB.start(u);
    const d = S.userDoc || {};
    const part = {};

ACT.quickStartMin = async el => {
  const min = +el.dataset.min;
  if (!Number.isFinite(min) || min < 1 || min > 180) return;
  if (TM.running) {
    if (!await confirmBox(t('confirm_restart_timer'), { ok: t('ok') })) return;
    const currentRemaining = Math.max(0, Math.ceil((TM.endAt - Date.now()) / 1000));
    if (TM.mode === 'focus') {
      const elapsed = Math.max(0, Math.min(TM.total, TM.total - currentRemaining));
      if (elapsed >= 1) await logSession({ mode: 'focus', seconds: elapsed, partial: true });
    }
    TM.running = false;
    TM.endAt = 0;
    clearInterval(TM.tick); TM.tick = null;
    releaseWake();
    setLive(0);
    document.title = 'FocusFlow Pro';
    await leaseRelease();
    await persistTimer();
  }
  S.prefs.durFocus = min;
  lsSet('prefs', S.prefs);
  saveUserDocDebounced();
  TM.mode = 'focus';
  TM.total = TM.remaining = min * 60;
  TM.sessionStart = 0;
  TM.sessionId = null;
  TM.running = false;
  TM.endAt = 0;
  go('focus');
  setTimeout(async () => {
    await startTimer();
    if (PAGES.focus && PAGES.focus.mounted) PAGES.focus.update($('#page-focus'));
  }, 120);
};

function getAmbientPlaylists() {
  const list = Array.isArray(S.prefs.ambientPlaylists) ? S.prefs.ambientPlaylists : [];
  return list.filter(x => x && typeof x.id === 'string' && typeof x.name === 'string').map(x => {
    const sounds = {};
    Object.entries(x.sounds || {}).forEach(([id, vol]) => {
      if (SOUND_DEFS[id] && Number(vol) > 0) sounds[id] = clamp(Number(vol), .05, 1);
    });
    return { id: x.id, name: x.name, sounds };
  });
}

      const list = getAmbientPlaylists();
      if (current) {
        const i = list.findIndex(x => x.id === current.id);

      toast(t('ambient_list_saved'), 'success');
      api.close(); openAmbientPlaylistPicker();
      return false;

    }));
    api.el.querySelectorAll('[data-ambient-level]').forEach(slider => slider.addEventListener('input', () => {
      const out = api.el.querySelector(`[data-ambient-value="${slider.dataset.ambientLevel}"]`);
      if (out) out.textContent = slider.value + '%';
    }));
  } });
}

/* v44 FIX: When the timer is paused mid-session, changing the duration now
   adjusts the remaining time by the delta instead of resetting it to the
   new full duration — so the pause progress is preserved. A fresh timer
   (remaining === total) still snaps to the new duration. */
function applyDurChange(k, raw) {
  const lim = { durFocus: [5, 180], durShort: [1, 60], durLong: [5, 90] }[k];
  if (!lim) return;

  // Always treat stored preferences as numbers. Older/local/cloud data may
  // contain duration values as strings (for example, "25").
  const oldVal = Number(S.prefs[k]);
  const parsed = Number(raw);
  const requested = Number.isFinite(parsed) ? Math.round(parsed) : oldVal;
  const newVal = clamp(requested, lim[0], lim[1]);

  if (newVal !== oldVal) {
    const deltaSec = (newVal - oldVal) * 60;
    setPref(k, newVal); // saved locally + synced to the cloud user doc (all devices)
    const modeKey = { durFocus: 'focus', durShort: 'short', durLong: 'long' }[k];

    if (modeKey === TM.mode) {
      if (TM.running) {
        const left = Math.max(0, Math.ceil((TM.endAt - Date.now()) / 1000));
        const nl = Math.max(10, left + deltaSec);
        TM.endAt = Date.now() + nl * 1000;
        TM.total = Math.max(10, TM.total + (nl - left));
        TM.remaining = nl;
        saveLocalTimerState(timerCloudSnapshot());
        leaseTx((cur, w) => {
          if (cur && cur.sessionId === TM.sessionId && cur.instanceId === TIMER_CLIENT_ID) {
            w.lease({ ...cur, endsAt: TM.endAt, total: TM.total });
          }
        }).catch(() => { });
      } else {
        const wasFresh = Math.abs(TM.remaining - TM.total) < 5;
        if (wasFresh) {
          TM.total = newVal * 60;
          TM.remaining = newVal * 60;
        } else {
          TM.remaining = clamp(TM.remaining + deltaSec, 10, Math.max(10, newVal * 60));
          TM.total = Math.max(TM.total + deltaSec, TM.remaining);
        }
        TM.sessionStart = 0;
        TM.sessionId = null;
        TM.endAt = 0;
        persistTimer();
      }
    }
  }

  if (PAGES.focus && PAGES.focus.mounted) PAGES.focus.update($('#page-focus'));
  renderTimerUI();
}

const CD = { view: 'list', deckId: null, queue: [], idx: 0, flipped: false, cram: false, good: 0, again: 0, total: 0 };

/* ═════════ STUDY PLAN: daily new-word planner, forecast, charts & calendar ═════════ */
const PLAN_DEF = { mode: 'count', count: 30, target: '', minutes: 40, sec: 25, week: [30, 30, 30, 30, 30, 30, 0], maxRev: 300, maxTotal: 400, order: 'deck', off: [], carry: 'spread', ov: {} };
const planCfg = () => ({ ...PLAN_DEF, ...(S.prefs.plan || {}) });
const planSave = p => setPref('plan', p);
const isNewCard = c => !c.reps && !(c.attempts > 0) && !(c.lapses > 0);
function planPool() { const cfg = planCfg(); return S.cards.filter(c => isNewCard(c) && !cfg.off.includes(c.deckId)); }
function planOrdered(pool, cfg) {
  const di = id => S.decks.findIndex(d => d.id === id);
  if (cfg.order === 'random') return shuffleList(pool.slice());
  if (cfg.order === 'mix') { const g = {}; pool.forEach(c => (g[c.deckId] = g[c.deckId] || []).push(c)); const L = Object.values(g), out = []; for (let i = 0; L.some(a => i < a.length); i++) L.forEach(a => a[i] && out.push(a[i])); return out; }

}
/* how many new words a given day should get */
function planQuota(date, cfg, remaining) {

  if (cfg.mode === 'time') return Math.max(0, Math.round(cfg.minutes * 60 / cfg.sec * .45));
  if (cfg.mode === 'date' && cfg.target) {

}

    const pool = planOrdered(planPool(), cfg), q = planQuota(new Date(), cfg, pool.length);

}
const planOn = () => !!(S.prefs.plan && S.prefs.plan.on);

/* forecast: day-by-day new + review load */

function srsNext(c, r) {
  let ease = c.ease || 2.5, reps = c.reps || 0, iv = c.interval || 0, lapses = c.lapses || 0, due;
  if (r === 0) { reps = 0; iv = 0; lapses++; ease = Math.max(1.3, ease - .2); due = Date.now() + 10 * 60000; }
  else {
    if (reps === 0) iv = [0, 1, 1, 4][r]; else if (reps === 1) iv = [0, 3, 6, 8][r]; else iv = Math.max(iv + 1, Math.round(iv * [0, 1.2, ease, ease * 1.3][r]));
    ease = clamp(ease + [0, -.15, 0, .15][r], 1.3, 3); reps++;
    due = startOfDay().getTime() + iv * 864e5;
  }
  return { ease, reps, interval: iv, lapses, due };
}
const ivLabel = (c, r) => { const n = srsNext(c, r); if (r === 0) return '10' + t('u_m'); return n.interval + t('u_d'); };

function openImportCards(initialText = '', deckId = '') {
  const parseCSVRow = (line) => {
    const out = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };

  const detectFormat = (text) => {
    text = (text || '').replace(/\r\n?/g, '\n');
    if (!text.trim()) return '—';
    if (/(?:^|\n)\s*(?:Q|S|Question|س|سؤال|Frage)\s*[:：.)-]/i.test(text)) return 'Q/A';
    const lines = text.split('\n').filter(l => l.trim() && !/^\s*#/.test(l));
    if (!lines.length) return '—';
    const sample = lines.slice(0, Math.min(20, lines.length));
    const n = sample.length || 1;
    if (sample.filter(l => l.includes('\t')).length > n * 0.5) return 'TSV';
    if (sample.filter(l => l.includes(' | ')).length > n * 0.5) return 'Pipe';
    if (sample.filter(l => l.includes(',')).length > n * 0.5) return 'CSV';
    if (sample.filter(l => /\s[-–—]\s/.test(l)).length > n * 0.5) return 'Dash';
    if (sample.filter(l => /[:：](?!\/\/)/.test(l)).length > n * 0.5) return 'Colon';
    return '—';

  const parseImportFlat = (text) => {
    text = (text || '').replace(/\r\n?/g, '\n');

    if (qa.length) {
      return qa.map(m => ({ front: m[1].trim().replace(/\n+/g, ' '), back: m[2].trim() }))
        .filter(c => c.front && c.back);
    }
    const lines = text.split('\n').filter(l => l.trim() && !/^\s*#/.test(l));
    const sample = lines.slice(0, Math.min(20, lines.length));
    const n = sample.length || 1;
    let splitter;
    if (sample.filter(l => l.includes('\t')).length > n * 0.5) splitter = l => l.split('\t');
    else if (sample.filter(l => l.includes(' | ')).length > n * 0.5) splitter = l => l.split(' | ');
    else if (sample.filter(l => l.includes(',')).length > n * 0.5) splitter = parseCSVRow;
    else if (sample.filter(l => /\s[-–—]\s/.test(l)).length > n * 0.5) splitter = l => { const m = l.match(/^(.+?)\s[-–—]\s(.+)$/); return m ? [m[1], m[2]] : null; };
    else splitter = l => { const i = l.search(/[:：](?!\/\/)/); return i > 0 ? [l.slice(0, i), l.slice(i + 1)] : null; };
    const firstParts = lines.length ? splitter(lines[0].trim()) : null;
    const deckCol = isHeaderRow(firstParts) && firstParts.length >= 3 && /^["']?\s*(deck|المجموعة|stapel)/i.test(String(firstParts[2]).trim());
    const out = [];
    lines.forEach((rawLine, idx) => {
      let line = rawLine.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim();
      if (!line) return;
      if (idx === 0 && isHeaderRow(splitter(line))) return;
      const parts = splitter(line);
      if (!parts || parts.length < 2) return;
      const front = String(parts[0] || '').trim();
      const back = String(parts[1] || '').trim();
      if (front && back) out.push({ front, back, deck: deckCol ? String(parts[2] || '').trim() : '' });
    });
    return out;
  };

  const isHeaderRow = p => !!p && p.length >= 2
    && /^["']?\s*(front|question|term|vorderseite|frage|سؤال|كلمة|الوجه الأمامي)\s*["']?$/i.test(String(p[0]).trim())

  const DECK_MARK = /^\s*#\s*(?:deck|المجموعة|stapel)\s*[:：]\s*(.+?)\s*$/i;
  const parseImportText = (text) => {

  const m = modal({

          let fallbackId = $('#icDeck').value;
          if (cards.some(c => !c.deck) && !fallbackId) {
            const name = ($('#icName').value || '').trim() || t('default_deck');
            fallbackId = (await newDeckQuick(name)).id;
          }
          const deckIdByName = new Map(S.decks.map(d => [d.name.trim().toLowerCase(), d.id]));

function exportGroups(deckId) {
  const decks = deckId ? S.decks.filter(d => d.id === deckId) : S.decks.slice();
  const groups = decks.map(d => ({ deck: d, name: d.name, cards: deckCards(d.id).slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)) }));
  if (!deckId) {
    const ids = new Set(S.decks.map(d => d.id));
    const orphans = S.cards.filter(c => !ids.has(c.deckId));
    if (orphans.length) groups.push({ deck: null, name: t('rv_other_group'), cards: orphans });
  }
  return groups;
}
function jsonToImportText(data) {
  const oneLine = v => String(v ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ').trim();
  const groups = new Map();
  const add = (deck, c) => {
    if (!c) return; const f = oneLine(c.front), b = oneLine(c.back); if (!f || !b) return;
    const k = oneLine(deck); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f + '\t' + b);
  };
  if (Array.isArray(data)) data.forEach(c => add(c && (c.deckName || c.deck), c));
  else if (data && Array.isArray(data.decks) && data.decks.some(d => Array.isArray(d.cards))) data.decks.forEach(d => (d.cards || []).forEach(c => add(d.name, c)));
  else if (data && Array.isArray(data.cards)) {
    const nameById = {}; (data.decks || []).forEach(d => { if (d && d.id) nameById[d.id] = d.name; });
    data.cards.forEach(c => add(c && (c.deckName || nameById[c.deckId] || ''), c));
  }
  return [...groups].map(([name, rows]) => (name ? `# Deck: ${name}\n` : '') + rows.join('\n')).join('\n\n');
}
function buildCardsExport(groups, format) {
  const oneLine = v => String(v ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ').trim();
  const q = v => '"' + oneLine(v).replace(/"/g, '""') + '"';
  const filled = groups.filter(g => g.cards.length);
  if (format === 'json') {

async function pruneGoneShares() {

    let d; try { d = await CloudB.get('shares/' + x.id); } catch { d = undefined; }

  }

  if (dropped) { const bx = $('#shActList'); if (bx) setHTML(bx, activeSharesHTML()); }
}

async function handleShareText(text) {
  const cm = String(text).match(/^\s*(\d{8})\s*$/); if (cm) return requestCodeAccess(cm[1]);
  const sm = String(text).match(/#s=([a-z0-9]{6,20})/);
  if (sm) {
    const gone = () => toast('⌛ ' + LPK('الرابط غير موجود أو انتهت صلاحيته', 'Link not found or expired', 'Link nicht gefunden oder abgelaufen'), 'warn', 6000);
    if (!fb) { try { fb = await loadFirebase(); } catch { return toast(LPK('تعذّر الاتصال بالسيرفر. تحقق من الإنترنت.', 'Could not reach the server. Check your connection.', 'Server nicht erreichbar. Prüfe die Verbindung.'), 'warn', 6000); } }
    let d = null; try { d = await CloudB.get('shares/' + sm[1]); } catch (e) { console.warn(e); }
    if (!d || !d.payload) { if (!cloudOnly()) return toast(LPK('هذا الرابط القصير لحساب مسجّل. اطلب من صاحبه رابطًا «لشخص بدون حساب».', 'This short link is for signed-in accounts. Ask the owner for a "without account" link.', 'Dieser Kurzlink ist für angemeldete Konten. Bitte um einen Link „ohne Konto“.'), 'warn', 8000); return gone(); }
    let pl; try { pl = JSON.parse(d.payload); } catch { return gone(); }
    return presentImport(pl, undefined, d.maxUses ? () => claimShare(sm[1]) : undefined);
  }
  const m = String(text).match(/#share=([A-Za-z0-9_-]+)/) || String(text).match(/^\s*([A-Za-z0-9_-]{24,})\s*$/);
  if (!m) return toast(LPK('الرابط غير صالح', 'Invalid link', 'Ungültiger Link'), 'warn');
  let pl; try { pl = await unpackShare(m[1]); } catch { return toast(LPK('الرابط تالف أو غير مكتمل', 'The link is damaged or incomplete', 'Link beschädigt oder unvollständig'), 'warn'); }
  presentImport(pl);
}

/* Merge shared decks into the library. Same deck name → merged; same word in the same deck → skipped. */
async function mergeSharedDecks(decks, onProgress) {
  const ops = []; let added = 0, skipped = 0; const touched = new Set();
  for (const d of decks) {
    if (!d || !String(d.name || '').trim()) continue;
    const deck = await newDeckQuick(String(d.name).trim(), d.color);
    const seen = new Set(S.cards.filter(c => c.deckId === deck.id).map(c => normKey(c.front)));
    for (const c of d.cards || []) {
      const f = String(c.f ?? '').trim(), b = String(c.b ?? '').trim(); if (!f || !b) continue;
      const k = normKey(f); if (seen.has(k)) { skipped++; continue; } seen.add(k);
      const id = uid(); touched.add(deck.id); added++;
      ops.push({ kind: 'cards', id, data: { id, deckId: deck.id, front: f, back: b, ease: 2.5, reps: 0, interval: 0, lapses: 0, due: 0, createdAt: Date.now() } });
    }
  }
  if (ops.length) await batchWithProgress(ops, onProgress || (() => { }));
  return { added, skipped, touched, total: ops.length };
}

function ensureCardTracking(c) {

function umlautVariants(word) {

async function wiktionaryLookup(noun) {
  const clean = cleanStudyText(noun).replace(/^[,.;:!?]+|[,.;:!?]+$/g, '').trim();
  if (!clean) return { found: false, unavailable: false, articles: [] };
  const key = clean.toLocaleLowerCase('de');
  if (DE_DICT_CACHE.has(key)) return DE_DICT_CACHE.get(key);
  const saved = lsGet('deDict_v1_' + key, null);
  if (saved && saved.checkedAt && Date.now() - saved.checkedAt < 30 * 864e5) { DE_DICT_CACHE.set(key, saved); return saved; }
  try {
    const url = 'https://de.wiktionary.org/api/rest_v1/page/html/' + encodeURIComponent(clean);
    const response = await fetch(url, { headers: { 'Accept': 'text/html' } });
    if (!response.ok) {
      const miss = { found: false, unavailable: false, articles: [], checkedAt: Date.now() };
      DE_DICT_CACHE.set(key, miss); lsSet('deDict_v1_' + key, miss); return miss;
    }
    const source = await response.text();
    const doc = new DOMParser().parseFromString(source, 'text/html');
    const plain = (doc.body?.textContent || '').replace(/\u00a0/g, ' ');
    const articles = [...plain.matchAll(/Substantiv\s*,\s*([mfn])\b/gi)].map(m => ({ m: 'der', f: 'die', n: 'das' }[m[1].toLowerCase()]));
    const unique = [...new Set(articles)];
    const found = /\(Deutsch\)/i.test(plain) || /Deutsch/.test(plain);
    const result = { found, noun: unique.length > 0, articles: unique, unavailable: false, checkedAt: Date.now() };
    DE_DICT_CACHE.set(key, result); lsSet('deDict_v1_' + key, result); return result;
  } catch (e) {
    const result = { found: false, noun: false, articles: [], unavailable: true, checkedAt: Date.now() };
    DE_DICT_CACHE.set(key, result); return result;
  }
}

const PDFS = { url: null, key: null, name: '', text: '', file: null, id: null, selectedId: null, library: [] };
let _pdfLocalDBPromise = null;
function pdfOwnerKey() { return String(S.user && S.user.uid ? S.user.uid : 'guest'); }
function openPdfLocalDB() {
  if (!('indexedDB' in window)) return Promise.reject(new Error('indexeddb-unavailable'));
  if (_pdfLocalDBPromise) return _pdfLocalDBPromise;
  _pdfLocalDBPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('FocusFlowProPDFs', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('pdfBlobs')) db.createObjectStore('pdfBlobs', { keyPath: 'id' });
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => db.close();
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('indexeddb-open-failed'));
    req.onblocked = () => reject(new Error('indexeddb-blocked'));
  });
  _pdfLocalDBPromise.catch(() => { _pdfLocalDBPromise = null; });
  return _pdfLocalDBPromise;
}
const LocalPdfLibrary = {
  async list() {
    const db = await openPdfLocalDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('pdfs', 'readonly');
      const req = tx.objectStore('pdfs').getAll();
      req.onsuccess = () => resolve((req.result || []).filter(x => x.ownerKey === pdfOwnerKey()).sort((a, b) => (b.updatedAt || b.uploadedAt || 0) - (a.updatedAt || a.uploadedAt || 0)));
      req.onerror = () => reject(req.error || new Error('indexeddb-list-failed'));
    });
  },
  async get(id) {
    const db = await openPdfLocalDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['pdfs', 'pdfBlobs'], 'readonly');
      const metaReq = tx.objectStore('pdfs').get(id);
      const blobReq = tx.objectStore('pdfBlobs').get(id);
      tx.onerror = () => reject(tx.error || new Error('indexeddb-read-failed'));
      tx.onabort = () => reject(tx.error || new Error('indexeddb-read-aborted'));
      tx.oncomplete = () => {
        const meta = metaReq.result;
        const body = blobReq.result;
        resolve(meta && body && meta.ownerKey === pdfOwnerKey() ? { ...meta, blob: body.blob } : null);
      };
    });
  },
  async put(item, blob) {
    const db = await openPdfLocalDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['pdfs', 'pdfBlobs'], 'readwrite');
      tx.objectStore('pdfs').put(item);
      tx.objectStore('pdfBlobs').put({ id: item.id, blob });
      tx.oncomplete = () => resolve(item);
      tx.onerror = () => reject(tx.error || new Error('indexeddb-save-failed'));
      tx.onabort = () => reject(tx.error || new Error('indexeddb-save-aborted'));
    });
  },
  async delete(id) {
    const db = await openPdfLocalDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(['pdfs', 'pdfBlobs'], 'readwrite');
      tx.objectStore('pdfs').delete(id);
      tx.objectStore('pdfBlobs').delete(id);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error('indexeddb-delete-failed'));
      tx.onabort = () => reject(tx.error || new Error('indexeddb-delete-aborted'));
    });
  },
  async clear() {
    const owned = await this.list();
    for (const item of owned) await this.delete(item.id);
    PDFS.library = [];
  },
};
function pdfNoteKey(name, size) {

    if (h.endsWith('youtube.com') || h.endsWith('youtube-nocookie.com')) {
      const v = x.searchParams.get('v'); if (v) return { id: v, list };
      const m = x.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if (m) return { id: m[2], list };
      if (list) return { list };
    }
  } catch { }
  return null;
}

function calcEval(src) {
  const toks = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, '(' + Math.PI + ')').match(/\d+\.?\d*(?:e[+-]?\d+)?|[a-z]+|[-+*/^%(),!]|\s+/gi) || [];
  let i = 0; const peek = () => toks[i], next = () => toks[i++];
  const fn = { sin: x => Math.sin(x * Math.PI / 180), cos: x => Math.cos(x * Math.PI / 180), tan: x => Math.tan(x * Math.PI / 180), log: Math.log10, ln: Math.log, sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp };
  const ws = () => { while (toks[i] && /^\s+$/.test(toks[i])) i++; };
  function expr() { let v = term(); for (; ;) { ws(); const o = peek(); if (o === '+') { next(); v += term(); } else if (o === '-') { next(); v -= term(); } else return v; } }
  function term() { let v = pow(); for (; ;) { ws(); const o = peek(); if (o === '*') { next(); v *= pow(); } else if (o === '/') { next(); v /= pow(); } else if (o === '%') { next(); v %= pow(); } else return v; } }
  function pow() { let b = unary(); ws(); if (peek() === '^') { next(); return Math.pow(b, pow()); } return b; }
  function unary() { ws(); if (peek() === '-') { next(); return -unary(); } if (peek() === '+') { next(); return unary(); } return post(); }
  function post() { let v = atom(); ws(); while (peek() === '!') { next(); let r = 1; for (let k = 2; k <= Math.min(170, v); k++) r *= k; v = r; ws(); } return v; }
  function atom() {
    ws(); const x = next(); if (x === undefined) throw 0;
    if (/^\d/.test(x)) return parseFloat(x);
    if (x === '(') { const v = expr(); ws(); if (next() !== ')') throw 0; return v; }
    if (/^[a-z]+$/i.test(x)) { const k = x.toLowerCase(); if (k === 'pi') return Math.PI; if (k === 'e') return Math.E; if (fn[k]) { ws(); if (next() !== '(') throw 0; const v = expr(); ws(); if (next() !== ')') throw 0; return fn[k](v); } }
    throw 0;
  }
  const r = expr(); ws(); if (i < toks.length) throw 0; return r;
}

function mmPoint(node,side) { const w=node.width||190,h=76; return {x:node.x+(side==='out'?w:0),y:node.y+h/2}; }
function mmPath(a,b,type,curve) {
  const p=mmPoint(a,'out'), q=mmPoint(b,'in');

}

(() => {
  const fab = document.getElementById('fabAI');
  if (!fab) return;
  let dragging = false, moved = false, startX = 0, startY = 0, originLeft = 0, originTop = 0;
  fab.addEventListener('pointerdown', e => {
    if (S.prefs && S.prefs.aiFabLocked === true) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true; moved = false;
    const r = fab.getBoundingClientRect();
    originLeft = r.left; originTop = r.top;
    startX = e.clientX; startY = e.clientY;
    fab.style.left = r.left + 'px'; fab.style.top = r.top + 'px';
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
    fab.style.cursor = 'grabbing';
    try { fab.setPointerCapture(e.pointerId); } catch (_) {}
  });
  fab.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
    if (!moved) return;
    const left = Math.max(8, Math.min(window.innerWidth - fab.offsetWidth - 8, originLeft + dx));
    const top = Math.max(8, Math.min(window.innerHeight - fab.offsetHeight - 8, originTop + dy));
    fab.style.left = left + 'px'; fab.style.top = top + 'px';
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false; fab.style.cursor = S.prefs && S.prefs.aiFabLocked ? 'pointer' : 'grab';
    if (moved) {
      const r = fab.getBoundingClientRect();
      setPref('aiFabPos', { left: Math.round(r.left), top: Math.round(r.top) });
    }
  };
  fab.addEventListener('pointerup', finish);
  fab.addEventListener('pointercancel', finish);
  fab.addEventListener('click', e => {
    if (moved) { e.preventDefault(); e.stopImmediatePropagation(); moved = false; }
  }, true);
  window.addEventListener('resize', () => {
    if (S.prefs) applyPrefs();
  });
})();

             'Zeigt deine Kontodaten an. Deinen Namen kannst du über die Schaltfläche „Bearbeiten“ ändern; die E-Mail-Adresse dient zur Identifikation des Kontos.'],
            ['تسجيل الخروج', 'Sign out', 'Abmelden',
             'ينهي جلسة الدخول الحالية على هذا التطبيق. تأكد من مزامنة البيانات التي تحتاج إليها قبل تسجيل الخروج إذا كنت تستخدم الحساب السحابي.',
             'Ends your current sign-in session in this app. If you use cloud mode, make sure any data you need has synced before signing out.',
             'Beendet deine aktuelle Anmeldung in dieser App. Wenn du den Cloud-Modus verwendest, stelle vor dem Abmelden sicher, dass benötigte Daten synchronisiert wurden.']
          ]]
        ];
        return groups.map(([arHeading, enHeading, deHeading, entries]) => html`<div class="sg"><div class="sg-t">${[arHeading, enHeading, deHeading][languageIndex]}</div>${entries.map(entry => {
          const title = entry[languageIndex];
          const desc = entry[languageIndex + 3];
          return html`<details style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:6px 0;background:var(--surface)"><summary style="cursor:pointer;font-weight:650">${title}</summary><p class="muted" style="line-height:1.8;margin:8px 2px 2px">${desc}</p></details>`;
        })}</div>`);
      })()}
      </div>`,
      about: html`<div class="sg"><div class="sg-t">FocusFlow Pro</div>${sRow(t('version'), '', html`<b class="mono">v${APP_VERSION}</b>`)}${sRow(LANG === 'ar' ? 'إصدار Firebase SDK' : LANG === 'de' ? 'Firebase-SDK-Version' : 'Firebase SDK version', '', html`<b class="mono">${FIREBASE_VERSION}</b>`)}${sRow(t('shortcuts'), '', html`<button class="btn sm" data-act="help">⌨️</button>`)}</div>`,
    };
    setHTML(el, html`${pageHead(t('p_settings'), t('settings_desc'))}<div class="set-wrap"><div class="set-nav">${tabs.map(k => html`<button class="${setTab === k ? 'on' : ''}" data-act="setTab" data-k="${k}">${t('st_' + k)}</button>`)}</div><div class="card">${sec[setTab]}</div></div>`);
  },
});
ACT.setTab = el => { setTab = el.dataset.k; PAGES.settings.update($('#page-settings')); };
const refreshSettings = () => { if (curPage === 'settings') PAGES.settings.update($('#page-settings')); };
ACT.prefTog = el => { setPref(el.dataset.k, !S.prefs[el.dataset.k]); if (el.dataset.k === 'notif' && S.prefs.notif && 'Notification' in window) Notification.requestPermission(); refreshSettings(); };
CHG.prefSel = el => { const k = el.dataset.k; let v = el.value; if (['firstDay'].includes(k)) v = +v; setPref(k, v); if (['ringStyle', 'firstDay'].includes(k)) { renderTimerUI(); recomputeStats(); touch('stats'); } if (k !== 'lang') refreshSettings(); };
ACT.prefNum = el => { const k = el.dataset.k; setPref(k, clamp(+S.prefs[k] + +el.dataset.d, +el.dataset.min, +el.dataset.max)); if (['durFocus', 'durShort', 'durLong'].includes(k) && !TM.running) { TM.total = TM.remaining = modeSecs(TM.mode); persistTimer(); renderTimerUI(); } if (['dailyGoalMin', 'weeklyGoalH', 'streakMin'].includes(k)) { recomputeStats(); touch('stats'); } refreshSettings(); };
INP.prefRange = el => { setPref(el.dataset.k, +el.value); renderTimerUI(); const b = el.nextElementSibling; if (b && b.tagName === 'B') b.textContent = el.value + (el.dataset.k === 'aiFabSize' ? 'px' : '%'); };
ACT.prefAccent = el => { setPref('accent', el.dataset.c); refreshSettings(); };
CHG.prefColor = el => { setPref('accent', el.value); refreshSettings(); };
ACT.alertTest = () => playAlert();
ACT.pwReset = async () => { try { await fb.Au.sendPasswordResetEmail(fb.auth, S.user.email); toast(t('auth_reset_sent'), 'success'); } catch (e) { toast(authErrText(e), 'error'); } };
ACT.exportData = async () => { const d = await DB.exportAll(); download(`focusflow-backup-${dayKey()}.json`, JSON.stringify(d, null, 1)); };
ACT.importData = () => $('#impF').click();
CHG.importFile = async el => { const f = el.files[0]; if (!f) return; try { const n = await DB.importAll(JSON.parse(await f.text())); toast(t('imported_n', { n }), 'success'); } catch { toast(t('import_bad'), 'error'); } el.value = ''; };
ACT.clearSessions = async () => { if (!await confirmBox(t('confirm_delete'), { danger: true, ok: t('delete') })) return; await DB.batch(S.sessions.map(s => ({ kind: 'sessions', id: s.id, del: true }))); toast(t('deleted'), 'info'); };
ACT.wipeAll = async () => { if (!await confirmBox(t('wipe_confirm'), { danger: true, ok: t('delete') })) return; await DB.wipeAll(); toast(t('deleted'), 'info'); };
CHG.prefHitColor = el => { setPref('hitColor', el.value); };
ACT.prefHit = el => { setPref('hitColor', el.dataset.c || ''); PAGES.settings.update($('#page-settings')); };
ACT.resetPrefs = async () => { if (!await confirmBox(t('confirm_reset'), { ok: t('reset') })) return; S.prefs = { ...DEFAULT_PREFS, lang: S.prefs.lang }; lsSet('prefs', S.prefs); applyPrefs(); DB.mergeUser({ prefs: S.prefs }); rebuildShell(); };
ACT.deleteAccount = async () => {
  if (!await confirmBox(t('delete_account_confirm'), { danger: true, ok: t('delete') })) return;
  try { await DB.wipeAll(); await CloudB.del('profiles/' + S.user.uid).catch(() => { }); await CloudB.del('users/' + S.user.uid).catch(() => { }); await fb.Au.deleteUser(fb.auth.currentUser); lsDel('prefs'); lsDel('timer'); toast(t('deleted'), 'info'); }
  catch (e) { toast((e && e.code === 'auth/requires-recent-login') ? t('relogin') : t('err_generic'), 'error', 6000); }
};

const GRAMMAR_RULES = [{"id":"present","title":"تصريف الأفعال في Präsens","level":"A1","explain":"نهاية الفعل تتغير حسب الفاعل. احذف -en من المصدر لتحصل غالبًا على الجذر، ثم أضف النهاية المناسبة. بعض الأفعال تغيّر حرف العلة مع du و er/sie/es.","structure":"المصدر: lernen → الجذر lern-","endings":"ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en","mistakes":"انتبه إلى الفرق بين du و ihr: كلاهما يختلف عن المصدر، لكن du غالبًا -st و ihr -t.","words":"أفعال من مفرداتك: reisen, kochen, suchen, sprechen, essen, fahren, bleiben."},{"id":"seinhaben","title":"الفعلان sein و haben","level":"A1","explain":"الفعلان أساسيان وغير منتظمين. نستخدم sein لوصف الحالة والهوية والمكان، وhaben للملكية وكثير من التراكيب.","structure":"sein: ich bin · du bist · er ist · wir sind · ihr seid · sie sind","endings":"haben: ich habe · du hast · er hat · wir haben · ihr habt · sie haben","mistakes":"لا تقل ich ist أو du hat. احفظ الصيغ كما هي، ولا تطبق عليها نهايات الأفعال العادية.","words":"أمثلة مألوفة: Ich bin müde. / Wir haben Zeit."},{"id":"wordorder","title":"ترتيب الجملة الرئيسية (Verb auf Position 2)","level":"A1","explain":"في الجملة الخبرية الألمانية يأتي الفعل المصرف في المركز الثاني. يمكن أن تبدأ الجملة بالفاعل أو بظرف زمان أو مكان، لكن الفعل يظل ثاني عنصر.","structure":"فاعل + فعل مصرف + باقي الجملة. / ظرف + فعل مصرف + فاعل + باقي الجملة.","endings":"Heute fahre ich ans Meer. / Morgen buche ich ein Hotel.","mistakes":"إذا بدأت بظرف مثل heute أو morgen، لا تضع الفعل بعد الفاعل؛ الفعل يأتي مباشرة بعد الظرف.","words":"كلمات وقت من قائمتك: morgen, übermorgen, nächste Woche, bald, später."},{"id":"questions","title":"تكوين الأسئلة: Ja/Nein و W-Fragen","level":"A1","explain":"في سؤال نعم/لا يأتي الفعل المصرف أولًا. أما سؤال أداة الاستفهام فيأتي بهذا الترتيب: أداة السؤال ثم الفعل ثم الفاعل.","structure":"Ja/Nein: فعل + فاعل + ...؟ / W-Frage: أداة سؤال + فعل + فاعل + ...؟","endings":"Fährst du morgen? / Wann fährt der Zug ab?","mistakes":"لا تضع الفاعل قبل الفعل في سؤال نعم/لا، ولا تؤخر الفعل بعد أداة السؤال.","words":"أدوات مهمة: wer, was, wo, wohin, wann, warum, wie, welche."},{"id":"nominative","title":"حالة Nominativ: الفاعل","level":"A1","explain":"تُستخدم Nominativ للفاعل، أي الشخص أو الشيء الذي يقوم بالفعل أو الذي نتحدث عنه في جملة مع sein.","structure":"مذكر: der/ein · مؤنث: die/eine · محايد: das/ein · جمع: die","endings":"Der Bahnhof ist groß. / Eine Bluse ist elegant.","mistakes":"اسأل: من أو ما الذي يقوم بالفعل؟ هذا غالبًا هو الفاعل في Nominativ.","words":"أسماء من قائمتك: Bahnhof, Flughafen, Bluse, Hose, Hotel, Ticket, Arzt."},{"id":"accusative","title":"حالة Akkusativ: المفعول به المباشر","level":"A1","explain":"تُستخدم Akkusativ غالبًا للمفعول به المباشر بعد أفعال مثل haben, sehen, kaufen, suchen. أهم تغيير في أداة التعريف هو المذكر.","structure":"der → den · ein → einen · die تبقى die · das يبقى das · الجمع die","endings":"Ich suche den Bahnhof. / Sie kauft eine Bluse.","mistakes":"أكثر خطأ شائع: نسيان تحويل der إلى den و ein إلى einen في المذكر.","words":"أفعال مناسبة: suchen, buchen, bestellen, anprobieren, umtauschen, sehen."},{"id":"dative","title":"حالة Dativ: المفعول غير المباشر","level":"A2","explain":"تأتي Dativ بعد أفعال وحروف جر معينة، مثل helfen و mit و bei و zu. احفظ أدوات التعريف في هذه الحالة.","structure":"der → dem · die → der · das → dem · الجمع die → den (+n غالبًا للاسم)","endings":"Ich helfe dem Arzt. / Wir fahren mit der Bahn.","mistakes":"بعد mit و bei و zu و von و aus و nach و seit و gegenüber نستخدم Dativ.","words":"أفعال: helfen, gefallen, passen. حروف جر: mit, bei, zu, von, aus, nach, seit."},{"id":"pronouns","title":"الضمائر الشخصية في Akkusativ و Dativ","level":"A2","explain":"الضمير يحل محل الاسم. اختيار الصيغة يعتمد على وظيفة الضمير: مفعول مباشر Akkusativ أو غير مباشر Dativ، وبعض الأفعال تطلب Dativ.","structure":"Nominativ: ich/du/er/sie/es/wir/ihr/sie · Akk: mich/dich/ihn/sie/es/uns/euch/sie · Dat: mir/dir/ihm/ihr/ihm/uns/euch/ihnen","endings":"Der Arzt hilft mir. / Ich sehe ihn.","mistakes":"احفظ خصوصًا الأزواج: ich→mich→mir، du→dich→dir، er→ihn→ihm.","words":"تراكيب: helfen + Dativ، gefallen + Dativ، sehen + Akkusativ."},{"id":"possessive","title":"أدوات الملكية mein / dein / sein ...","level":"A1-A2","explain":"أداة الملكية تأخذ نهايات تشبه ein، وتتغير بحسب جنس الاسم وحالته الإعرابية. الجذر يحدد المالك، والنهاية تتبع الاسم المملوك.","structure":"مذكر Nominativ: mein · مؤنث/جمع: meine · مذكر Akkusativ: meinen · Dativ مذكر/محايد: meinem · Dativ مؤنث: meiner","endings":"mein Reisepass · meine Kreditkarte · meinen Koffer","mistakes":"لا تخلط بين صاحب الشيء وجنس الشيء: نهاية mein تتبع الاسم الذي يأتي بعدها، لا الشخص المالك.","words":"mein, dein, sein, ihr, unser, euer, Ihr."},{"id":"negation","title":"النفي بـ nicht و kein","level":"A1-A2","explain":"نستخدم kein لنفي اسم معه أداة نكرة أو بلا أداة غالبًا، ونستخدم nicht لنفي فعل أو صفة أو جزء محدد من الجملة أو اسم معه أداة معرفة.","structure":"kein يتصرف مثل ein: kein, keine, keinen, keinem... / nicht غالبًا يأتي قبل الجزء المنفي أو قرب نهاية الجملة.","endings":"Ich habe kein Ticket. / Das Hotel ist nicht teuer.","mistakes":"لا تستخدم nicht بدل kein مع اسم نكرة في جملة مثل Ich habe kein Ticket.","words":"مفردات: Ticket, Hotel, Kaffee, Zeit, Schmerzen, Hunger."},{"id":"adjdef","title":"نهايات الصفات بعد أداة معرفة","level":"A2","explain":"الصفة التي تسبق الاسم تأخذ نهاية. بعد der/die/das تكون النهايات غالبًا -e في Nominativ المفرد وبعض Akkusativ، و-en في أغلب الحالات الأخرى.","structure":"Nominativ: der nette Mann / die nette Frau / das nette Kind · Akk m: den netten Mann · Dativ: dem netten Mann","endings":"Der freundliche Arzt · die elegante Bluse · mit dem kleinen Kind","mistakes":"لا تترك الصفة بلا نهاية عندما تأتي قبل الاسم. أما بعد sein مثل Das Hotel ist schön فتظل الصفة بلا نهاية.","words":"صفّات من قائمتك: freundlich, lustig, hilfsbereit, höflich, geduldig, ehrlich, mutig, modern, elegant."},{"id":"adjmixed","title":"نهايات الصفات بعد ein / kein / أدوات الملكية","level":"A2","explain":"بعد ein و kein وأدوات الملكية تظهر النهايات القوية حيث لا تكشف الأداة الجنس بوضوح، مثل ein guter Kaffee و ein schönes Hotel.","structure":"Nominativ: ein guter Mann · eine gute Frau · ein gutes Hotel / Akk m: einen guten Mann / Dativ: einem guten Mann","endings":"mein neuer Reisepass · eine schöne Bluse · ein gutes Hotel","mistakes":"انتبه إلى المذكر Nominativ: ein guter، بينما Akkusativ يصبح einen guten.","words":"استخدم صفات مألوفة: neu, gut, schön, klein, groß, teuer, modern."},{"id":"adjstrong","title":"نهايات الصفات بدون أداة","level":"A2","explain":"عندما تأتي الصفة قبل الاسم من دون der أو ein، تحمل الصفة غالبًا علامة الجنس والحالة بنفسها. هذه هي النهايات القوية.","structure":"مذكر Nom -er · مؤنث Nom -e · محايد Nom -es · جمع Nom -e · Dativ غالبًا -em/-er/-en","endings":"Frischer Kaffee · frische Milch · frisches Brot · mit frischem Wasser","mistakes":"هذه القاعدة أصعب قليلًا؛ حدّد أولًا الجنس والحالة ثم اختر نهاية الصفة.","words":"أمثلة من مجال الطعام: Kaffee, Tee, Milch, Joghurt, Toast, Lebensmittel."},{"id":"accprep","title":"حروف الجر التي تأخذ Akkusativ","level":"A2","explain":"حروف الجر für, ohne, durch, gegen, um تأخذ Akkusativ دائمًا. لذلك تتغير أداة المذكر إلى den أو einen، بينما المؤنث والمحايد والجمع لها صيغها.","structure":"für/ohne/durch/gegen/um + Akkusativ · der→den · ein→einen","endings":"Das Geschenk ist für meinen Freund. / Ohne den Reisepass kann ich nicht reisen.","mistakes":"لا تخلط بين für + Akkusativ و mit + Dativ.","words":"حروف الجر: für, ohne, durch, gegen, um."},{"id":"datprep","title":"حروف الجر التي تأخذ Dativ","level":"A2","explain":"حروف الجر mit, nach, aus, zu, von, bei, seit تأخذ Dativ دائمًا. احفظها كمجموعة واحدة.","structure":"mit/nach/aus/zu/von/bei/seit + Dativ · dem/der/den","endings":"Ich fahre mit dem Zug. / Sie kommt aus der Türkei.","mistakes":"بعد mit لا تستخدم den في المذكر المفرد؛ الصحيح dem.","words":"مفردات السفر: Zug, Bahnhof, Flughafen, Hotel, Türkei, Deutschland."},{"id":"twoway","title":"حروف الجر المتغيرة: Wo? أم Wohin?","level":"A2","explain":"حروف الجر an, auf, hinter, in, neben, über, unter, vor, zwischen تأخذ Dativ للمكان الثابت (Wo?) وAkkusativ للاتجاه أو الحركة نحو مكان (Wohin?).","structure":"Wo? + Dativ: in dem = im · auf dem · an der / Wohin? + Akk: in das = ins · auf den · an die","endings":"Das Gepäck ist im Hotel. / Ich stelle das Gepäck ins Hotel.","mistakes":"اسأل Wo? = أين؟ للموقع الثابت، وWohin? = إلى أين؟ للاتجاه. الفعل وحده لا يكفي؛ معنى الجملة هو المهم.","words":"حروف: in, auf, an, neben, unter, über, vor, hinter, zwischen."},{"id":"modal","title":"الأفعال الناقصة Modalverben","level":"A1-A2","explain":"الفعل الناقص يُصرف حسب الفاعل ويأتي الفعل الأساسي في المصدر في نهاية الجملة. أشهرها können, müssen, wollen, dürfen, sollen, mögen.","structure":"ich kann/muss/will · du kannst/musst/willst · er kann/muss/will · wir können/müssen/wollen · الفعل الآخر Infinitiv في النهاية","endings":"Ich muss heute kochen. / Wir können morgen reisen.","mistakes":"صرف الفعل الناقص فقط؛ لا تصرف الفعل الثاني، بل اتركه مصدرًا في نهاية الجملة.","words":"können, müssen, wollen, dürfen, sollen, mögen."},{"id":"separable","title":"الأفعال المنفصلة Trennbare Verben","level":"A2","explain":"في الجملة الرئيسية ينفصل المقطع السابق عن الفعل المصرف ويذهب إلى نهاية الجملة. في المصدر وPartizip II قد يكتب الفعل متصلًا.","structure":"فاعل + فعل مصرف (الجذر) + ... + Präfix في النهاية: Ich stehe früh auf.","endings":"Ich checke am Flughafen ein. / Wir räumen die Küche auf.","mistakes":"لا تضع البادئة قبل الفاعل في الجملة الرئيسية؛ ضعها في آخر الجملة.","words":"أفعال: einchecken, anprobieren, aufräumen, abräumen, abwaschen, umtauschen, zurückgeben."},{"id":"reflexive","title":"الأفعال الانعكاسية Reflexive Verben","level":"A2","explain":"الفعل الانعكاسي يحتاج ضميرًا انعكاسيًا يتغير مع الفاعل. في Akkusativ: mich, dich, sich, uns, euch, sich.","structure":"ich mich · du dich · er/sie/es sich · wir uns · ihr euch · sie/Sie sich","endings":"Ich fühle mich gut. / Du bereitest dich auf die Reise vor.","mistakes":"لا تستخدم mich مع du؛ الضمير يجب أن يتبع الفاعل. بعض الأفعال قد تستخدم Dativ إذا وُجد مفعول آخر.","words":"sich fühlen, sich vorbereiten, sich sonnen, sich ernähren."},{"id":"perfhaben","title":"Perfekt مع haben","level":"A2","explain":"يتكون Perfekt من haben المصرف + Partizip II في نهاية الجملة. نستخدمه مع معظم الأفعال التي لا تدل على انتقال أو تغير حالة.","structure":"haben + Partizip II · الأفعال المنتظمة غالبًا ge- + جذر + -t · الأفعال غير المنتظمة غالبًا ge-...-en","endings":"Ich habe das Essen bestellt. / Wir haben Deutsch gelernt.","mistakes":"لا تصرف Partizip II حسب الفاعل، بل صرف haben فقط وضع Partizip II في النهاية.","words":"أفعال من قائمتك: kochen, bestellen, buchen, suchen, lernen, essen, trinken, sprechen."},{"id":"perfsein","title":"Perfekt مع sein","level":"A2","explain":"يُستخدم sein في Perfekt غالبًا مع أفعال الحركة من مكان إلى آخر أو تغير الحالة، مثل fahren, gehen, kommen, bleiben, fliegen.","structure":"sein المصرف + Partizip II في نهاية الجملة · ich bin · du bist · er ist · wir sind · ihr seid · sie sind","endings":"Wir sind ans Meer gefahren. / Das Flugzeug ist gelandet.","mistakes":"لا تستخدم haben تلقائيًا مع كل فعل؛ راقب معنى الحركة أو التغير، واحفظ الفعل مع مساعده.","words":"fahren, reisen, gehen, kommen, bleiben, fliegen, starten, landen."},{"id":"preterite","title":"Präteritum: sein و haben و Modalverben","level":"A2","explain":"يظهر Präteritum كثيرًا مع sein وhaben والأفعال الناقصة، خصوصًا في الكلام والكتابة البسيطة عن الماضي.","structure":"sein: war/warst/war/waren wart/waren · haben: hatte/hattest/hatte/hatten hattet/hatten · Modal: konnte, musste, wollte, durfte, sollte, mochte","endings":"Früher war ich in Deutschland. / Ich musste gestern lernen.","mistakes":"احفظ جذور صيغ الماضي؛ لا تضف نهايات Präsens إلى صيغة Präteritum.","words":"konnte, wollte, mochte, durfte, sollte, musste + war/hatte."},{"id":"subclauses","title":"الجمل التابعة مع weil و dass و wenn","level":"A2","explain":"بعد weil و dass و wenn يأتي الفعل المصرف في نهاية الجملة التابعة. إذا بدأت الجملة التابعة أولًا، يأتي الفعل في الجملة الرئيسية بعدها مباشرة.","structure":"Hauptsatz + weil/dass/wenn + فاعل + ... + فعل مصرف في النهاية.","endings":"Ich bleibe zu Hause, weil ich krank bin. / Ich glaube, dass das Hotel gut ist.","mistakes":"لا تضع الفعل في المركز الثاني داخل الجملة التابعة؛ انقله إلى نهايتها.","words":"روابط: weil, dass, wenn, falls, sofern."},{"id":"compare","title":"المقارنة والتفضيل Komparativ / Superlativ","level":"A2","explain":"للمقارنة نضيف غالبًا -er إلى الصفة ثم als. للتفضيل نستخدم am + الصفة + -sten. توجد صيغ شاذة مثل gut → besser → am besten.","structure":"schnell → schneller → am schnellsten · groß → größer → am größten · gut → besser → am besten","endings":"Der Flughafen ist größer als der Bahnhof. / Das ist am besten.","mistakes":"تذكر أن المقارنة تأخذ als، أما المساواة فتستخدم so ... wie.","words":"صفات: groß, klein, modern, lecker, gesund, gut, schnell, teuer, schön."},{"id":"future","title":"Futur I باستخدام werden","level":"A2","explain":"يتكون المستقبل من werden المصرف + مصدر الفعل في نهاية الجملة. كثيرًا ما يستخدم الألمان Präsens مع ظرف زمان للمستقبل، لكن Futur I صحيح للتوقع أو التأكيد.","structure":"ich werde · du wirst · er/sie/es wird · wir werden · ihr werdet · sie/Sie werden + Infinitiv","endings":"Ich werde nächste Woche reisen. / Wir werden ein Hotel buchen.","mistakes":"لا تضع الفعل في Partizip II؛ يجب أن يكون مصدرًا في نهاية الجملة.","words":"werden + reisen, buchen, fahren, lernen, kochen, arbeiten."},{"id":"imperative","title":"صيغة الأمر Imperativ","level":"A1-A2","explain":"نستخدم صيغة الأمر للطلب أو التعليمات. مع du غالبًا نحذف الضمير ونستخدم جذر الفعل، مع ihr نستخدم صيغة ihr دون الضمير، ومع Sie نستخدم المصدر ثم Sie.","structure":"du: Komm! / ihr: Kommt! / Sie: Kommen Sie bitte!","endings":"Kommen Sie bitte hierher. / Deck bitte den Tisch.","mistakes":"في الأمر الرسمي Sie يأتي الفعل أولًا ثم Sie. ولا نكتب du أو ihr في الأمر العادي.","words":"أفعال عملية: kommen, helfen, hören, sprechen, warten, decken, aufräumen."},{"id":"timeprep","title":"التعبير عن الوقت: am / um / im / von ... bis","level":"A1-A2","explain":"نستخدم um مع الساعة، am مع الأيام وأجزاء اليوم، im مع الشهور والفصول والسنوات، وvon ... bis لتحديد بداية ونهاية فترة.","structure":"um + Uhrzeit · am + Tag/Tageszeit · im + Monat/Jahreszeit · von ... bis ...","endings":"Der Zug fährt um 8 Uhr ab. / Wir fahren im Sommer ans Meer.","mistakes":"احفظ التركيب كاملًا: um 8 Uhr، am Montag، im Sommer، von 9 bis 12 Uhr.","words":"مفردات الوقت: morgen, übermorgen, nächste Woche, bald, später."}];

/* ── safe Markdown (escape first, then format) ── */
function acMd(src) {
  const blocks = [], codes = [];
  let s = String(src || '').replace(/```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g, (m, l, c) => { blocks.push([l, c.replace(/\n$/, '')]); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = esc(s);
  const inl = x => x
    .replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; })
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lines = s.split('\n'), out = []; let i = 0, para = [];
  const flush = () => { if (para.length) { out.push('<p>' + inl(para.join('\n')).replace(/\n/g, '<br>') + '</p>'); para = []; } };
  while (i < lines.length) {
    const l = lines[i]; let m;
    if (/^\s*$/.test(l)) { flush(); i++; continue; }
    if (/^\u0000\d+\u0000$/.test(l.trim())) { flush(); out.push(l.trim()); i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^&gt;\s?/.test(l)) { flush(); const q = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, '')); out.push('<blockquote>' + inl(q.join('<br>')) + '</blockquote>'); continue; }
    if (/^\s*[-*+]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)) { flush(); const ol = /^\s*\d+/.test(l), re = ol ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/, it = []; while (i < lines.length && re.test(lines[i])) it.push('<li>' + inl(lines[i++].replace(re, '')) + '</li>'); out.push(`<${ol ? 'ol' : 'ul'}>${it.join('')}</${ol ? 'ol' : 'ul'}>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      flush(); const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const hd = row(l); i += 2; const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(row(lines[i++]));
      out.push('<div class="ac-tw"><table><thead><tr>' + hd.map(h => `<th>${inl(h)}</th>`).join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>'); continue;
    }
    para.push(l); i++;
  }
  flush();
  return out.join('').replace(/\u0001(\d+)\u0001/g, (m, n) => `<code>${codes[n]}</code>`)
    .replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g, (m, a, b) => { const [lang, code] = blocks[a ?? b]; return `<div class="ac-code"><div class="ac-code-h"><span>${esc(lang || 'code')}</span><button data-act="acCopyCode">📋 ${esc(t('copy') === 'copy' ? ACL('نسخ', 'Copy', 'Kopieren') : t('copy'))}</button></div><pre><code>${esc(code)}</code></pre></div>`; })
    .replace(/\u0001(\d+)\u0001/g, (m, n) => `<code>${codes[n]}</code>`);
}
